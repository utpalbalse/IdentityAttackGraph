name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -count=1
      - name: gofmt
        run: test -z "$(gofmt -s -l .)" || (gofmt -s -l . && exit 1)
      - name: govulncheck
        # GOTOOLCHAIN=local forces govulncheck to be built with the job's Go (setup-go above), not
        # the older toolchain golang.org/x/vuln requests. A govulncheck built with an older Go can't
        # analyze this module's newer Go code and fails with "package requires newer Go version".
        # The tool version is pinned so a new release can't reintroduce that mismatch; the vuln DB is
        # still fetched live at run time.
        env:
          GOTOOLCHAIN: local
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  # DB-backed tests live in their own job so the unit job stays fast and dependency-free. These
  # exercise the real SQL against a real Postgres — the only way to catch a conflict target that
  # does not match a constraint, or an ORDER BY that is unstable under ties.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nhiid
          POSTGRES_PASSWORD: nhiid
          POSTGRES_DB: nhiid_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nhiid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: store integration tests
        env:
          NHIID_TEST_DATABASE_DSN: postgres://nhiid:nhiid@localhost:5432/nhiid_test?sslmode=disable
        run: go test -tags=integration ./internal/store/... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || npm install
      - run: npm run build
