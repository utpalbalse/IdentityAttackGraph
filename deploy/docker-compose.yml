# One-command local stack. `docker compose -f deploy/docker-compose.yml up --build -d` brings up
# postgres/redis/nats, runs DB migrations once, then starts api + worker + web — no local Go/Node
# toolchain required. See README "Quick start" and docs/RUNBOOK.md.

x-nhiid-build: &nhiid-build
  context: ..
  dockerfile: deploy/docker/Dockerfile

x-backend-env: &backend-env
  NHIID_DATABASE_DSN: postgres://nhiid:nhiid@postgres:5432/nhiid?sslmode=disable
  NHIID_QUEUE_NATS_URL: nats://nats:4222
  NHIID_CACHE_REDIS_URL: redis://redis:6379/0
  NHIID_TELEMETRY_LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nhiid
      POSTGRES_PASSWORD: nhiid
      POSTGRES_DB: nhiid
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhiid"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2-alpine
    command: --jetstream
    ports: ["4222:4222", "8222:8222"]

  # One-shot: applies embedded SQL migrations, then exits 0.
  migrate:
    build: *nhiid-build
    image: nhiid:local
    command: ["migrate", "up"]
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *nhiid-build
    image: nhiid:local
    command: ["api"]
    environment: *backend-env
    ports: ["8080:8080", "9090:9090"] # 9090 = Prometheus /metrics
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: *nhiid-build
    image: nhiid:local
    command: ["worker"]
    environment: *backend-env
    ports: ["9091:9090"] # worker Prometheus /metrics
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    ports: ["5173:5173"]
    depends_on:
      - api

  # One-shot demo seeding, so a first run needs no `make` and no local toolchain:
  #   docker compose -f deploy/docker-compose.yml --profile demo up --build -d
  # Loads the synthetic AWS+GCP+K8s fixtures and runs graph/score/detect once, then exits.
  # Writes straight to postgres, so it doesn't wait on the API.
  seed:
    build: *nhiid-build
    image: nhiid:local
    profiles: ["demo"]
    command:
      - sh
      - -c
      - >-
        collector --provider fixture --fixture fixtures/demo_env.json &&
        collector --provider k8s --cluster demo --k8s-export fixtures/k8s_cluster.json &&
        worker --once --job all
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Continuous discovery against a real cloud account. Off by default (profile-gated) so the demo
  # stack stays lean; enable with:
  #   docker compose -f deploy/docker-compose.yml --profile collect up -d
  # Point it at a target with COLLECTOR_* / AWS_* env vars (see docs/GETTING_STARTED.md), e.g.
  #   COLLECTOR_PROVIDER=aws COLLECTOR_INTERVAL=30m \
  #   COLLECTOR_ARGS="--role-arn arn:aws:iam::123456789012:role/nhiid-collector --external-id s3cr3t"
  # `exec` keeps the collector as PID 1 so SIGTERM reaches it and it shuts down gracefully.
  collector:
    build: *nhiid-build
    image: nhiid:local
    profiles: ["collect"]
    command:
      - sh
      - -c
      - exec collector --provider "$$COLLECTOR_PROVIDER" --interval "$$COLLECTOR_INTERVAL" $$COLLECTOR_ARGS
    environment:
      <<: *backend-env
      COLLECTOR_PROVIDER: ${COLLECTOR_PROVIDER:-aws}
      COLLECTOR_INTERVAL: ${COLLECTOR_INTERVAL:-30m}
      COLLECTOR_ARGS: ${COLLECTOR_ARGS:-}
      # Credentials are passed through from your shell; nothing is baked into the image.
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
